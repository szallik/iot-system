# Konfiguracja brokera dla projektu IoT.
# bootstrap.sh kopiuje ten plik do /etc/mosquitto/conf.d/iot.conf
# Domyślny /etc/mosquitto/mosquitto.conf zawiera "include_dir /etc/mosquitto/conf.d".

# Nasłuch na wszystkich interfejsach – laptopy w sieci laboratorium mogą podglądać komunikaty.
listener 1883

# Środowisko laboratoryjne: bez kont i haseł (tak jak przed awarią karty).
allow_anonymous true
