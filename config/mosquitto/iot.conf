# Konfiguracja brokera dla projektu IoT.
# bootstrap.sh kopiuje ten plik do /etc/mosquitto/conf.d/iot.conf
# Domyślny /etc/mosquitto/mosquitto.conf zawiera "include_dir /etc/mosquitto/conf.d".

# Nasłuch na wszystkich interfejsach (backend i Z2M łączą się przez localhost,
# laptopy w sieci laboratorium mogą podglądać komunikaty po zalogowaniu).
listener 1883

# Bez dostępu anonimowego – konta tworzy bootstrap.sh na podstawie .env
allow_anonymous false
password_file /etc/mosquitto/passwd
